name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marwa_digital_test
  JWT_SECRET: ci-test-secret-do-not-use-in-production
  NEXT_PUBLIC_API_URL: http://localhost:4000
  NEXT_PUBLIC_WEB_URL: http://localhost:3000
  API_URL: http://localhost:4000
  WEB_URL: http://localhost:3000
  ADMIN_URL: http://localhost:3001
  SEED_ADMIN_EMAIL: admin@marwadigital.com
  SEED_ADMIN_PASSWORD: changeme123

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint all workspaces
        run: npm run lint

      - name: Build & type-check packages/builder
        run: |
          npm --workspace=@marwa/builder run build
          npm --workspace=@marwa/builder run typecheck

      - name: Type-check packages/api
        run: npx tsc --noEmit -p packages/api

      - name: Type-check apps/web
        run: npx tsc --noEmit -p apps/web

      - name: Type-check apps/admin
        run: npx tsc --noEmit -p apps/admin

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marwa_digital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Sync database schema
        run: npx prisma db push --schema=packages/db/prisma/schema.prisma --accept-data-loss
        working-directory: .

      - name: Seed the database (creates the standard admin account these tests sign in as)
        run: npm run seed --workspace=@marwa/db

      - name: Run unit & integration tests (Vitest — packages/api, packages/builder)
        run: npm run test

      - name: Install Playwright browsers
        run: |
          npx --prefix apps/web playwright install --with-deps chromium
          npx --prefix apps/admin playwright install --with-deps chromium

      - name: Start API, apps/web, and apps/admin
        run: |
          npm run dev --workspace=@marwa/api > api.log 2>&1 &
          npm run dev --workspace=@marwa/web > web.log 2>&1 &
          npm run dev --workspace=@marwa/admin > admin.log 2>&1 &

      - name: Wait for all three services to be ready
        run: |
          npx wait-on -t 120000 http://localhost:4000/health http://localhost:3000 http://localhost:3001/login

      - name: Run end-to-end tests (Playwright — public pages, admin login/2FA, page revisions, contact-lead-audit trail, CRM deal drag-and-drop, session recording replay)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/admin/playwright-report/
            *.log
          retention-days: 7
